<!DOCTYPE html>
<html>
<head>
  <title>Ghost Configuration</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
    .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    button { padding: 5px 10px; cursor: pointer; }
    .danger { color: red; }
  </style>
</head>
<body>
  <h1>Ghost in the Machine - Dashboard</h1>

  <div class="card">
    <h2>Haunted Sites (Block List)</h2>
    <input type="text" id="newSite" placeholder="e.g., reddit.com">
    <input type="number" id="newTime" placeholder="Minutes" min="0.1" step="0.1">
    <button id="addSiteBtn">Add to Blocklist</button>
    
    <table id="blockListTable">
      <thead>
        <tr>
          <th>Website</th>
          <th>Time Limit (Min)</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="blockListBody">
        <!-- JS will populate this -->
      </tbody>
    </table>
  </div>

  <div class="card">
    <h2>Wandering Souls (Visited Sites Report)</h2>
    <button id="clearReportBtn">Clear History</button>
    <table id="reportTable">
      <thead>
        <tr>
          <th>Website</th>
          <th>Visits/Time Spent</th>
        </tr>
      </thead>
      <tbody id="reportBody">
        <!-- JS will populate this -->
      </tbody>
    </table>
  </div>

  <script src="options.js"></script>
</body>
</html>
