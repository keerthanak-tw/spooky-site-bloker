<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 10px; font-family: sans-serif; }
    label { display: block; margin-top: 10px; font-size: 14px; }
    .time-inputs { display: flex; gap: 5px; margin-top: 5px; }
    input[type="text"] { width: 100%; margin-top: 5px; padding: 5px; box-sizing: border-box; }
    input[type="number"] { width: 60%; padding: 5px; box-sizing: border-box; }
    select { width: 40%; padding: 5px; }
    button { margin-top: 10px; width: 100%; padding: 8px; cursor: pointer; }
    #status { margin-top: 10px; color: green; font-size: 12px; text-align: center; }
    
    hr { margin: 15px 0; border: 0; border-top: 1px solid #ccc; }
    .site-list { list-style: none; padding: 0; margin: 0; }
    .site-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 13px; }
    .remove-btn { background: #ff4d4d; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; width: auto; margin: 0; }
  </style>
</head>
<body>
  <h3>Spooky Blocker</h3>
  
  <label for="site">Website to haunt (e.g., youtube.com):</label>
  <input type="text" id="site" placeholder="youtube.com">
  
  <label for="timeValue">Time before haunting:</label>
  <div class="time-inputs">
    <input type="number" id="timeValue" placeholder="1" min="0.1" step="0.1">
    <select id="timeUnit">
      <option value="minutes">Minutes</option>
      <option value="hours">Hours</option>
    </select>
  </div>
  
  <button id="saveBtn">Add Site</button>
  <div id="status"></div>

  <hr>
  <h4>Active Hauntings</h4>
  <ul id="activeSites" class="site-list">
    <!-- JS will populate this -->
  </ul>

  <script src="popup.js"></script>
</body>
</html>
